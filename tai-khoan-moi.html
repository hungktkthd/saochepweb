
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập - Học tiếng Trung</title>
</head>
<body>
  <h2>Tài khoản học tập</h2>
  <button id="login">Đăng nhập bằng Google</button>
  <button id="logout" hidden>Đăng xuất</button>
  <p id="status">Đang kiểm tra đăng nhập...</p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.min.js"></script>
  <script>
    const client = window.supabase.createClient(
      "https://skxgzzdunqloxxombtuc.supabase.co",
      "sb_publishable_tyYxDk87Wa70dYxea2ljug_DCZEx-18"
    );

    const login = document.getElementById("login");
    const logout = document.getElementById("logout");
    const status = document.getElementById("status");

    login.onclick = async () => {
      const { error } = await client.auth.signInWithOAuth({
        provider: "google",
        options: {
          redirectTo:
            "https://hoctiengtrungquoc.vercel.app/tai-khoan"
        }
      });

      if (error) status.textContent = error.message;
    };

    logout.onclick = async () => {
      const { error } = await client.auth.signOut();
      if (error) status.textContent = error.message;
    };

    function updateUI(session) {
      const user = session?.user;
      status.textContent = user
        ? "Đã đăng nhập: " + user.email
        : "Chưa đăng nhập";
      login.hidden = !!user;
      logout.hidden = !user;
      if (user && session?.access_token) {
        try {
          const meta = user.user_metadata || {};
          const displayName = meta.full_name || meta.name || user.email.split("@")[0];
          const avatar = meta.avatar_url || meta.picture || "";
          const userObj = {
            id: user.id,
            _id: user.id,
            email: user.email,
            username: user.email.split("@")[0],
            name: displayName,
            displayName: displayName,
            avatar: avatar,
            role: "user",
            isGuest: false,
            streak: 5
          };
          localStorage.setItem("xiehanzi_access_token", session.access_token);
          localStorage.setItem("sb_access_token", session.access_token);
          localStorage.setItem("httq_user", JSON.stringify(userObj));
          localStorage.setItem("httq_user_id", user.id);
          localStorage.setItem("httq_real_auth", "1");
        } catch (_e) {}
      }
    }

    client.auth.onAuthStateChange((_event, session) => {
      updateUI(session);
    });

    client.auth.getSession().then(({ data, error }) => {
      if (error) {
        status.textContent = error.message;
        return;
      }
      updateUI(data.session);
    });
  </script>
</body>
</html>
