
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập - Học tiếng Trung</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Đăng nhập và đồng bộ phiên tài khoản học tiếng Trung.">
  <link rel="canonical" href="https://hoctiengtrungquoc.vercel.app/tai-khoan-moi/">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8fafc;
      --card: #ffffff;
      --ink: #0f172a;
      --muted: #475569;
      --border: #e2e8f0;
      --soft: #f1f5f9;
      --accent: #0d9488;
      --accent-hover: #0f766e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1020;
        --card: #111827;
        --ink: #f8fafc;
        --muted: #cbd5e1;
        --border: #334155;
        --soft: #1e293b;
        --accent: #14b8a6;
        --accent-hover: #0d9488;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    main.auth-card {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 28px 26px;
      box-shadow: 0 20px 48px rgba(15, 23, 42, 0.12);
    }
    .auth-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--soft);
      padding: 5px 11px;
      border-radius: 999px;
      margin-bottom: 14px;
    }
    h1 {
      font-size: 24px;
      line-height: 1.3;
      font-weight: 800;
      margin: 0 0 10px;
    }
    .auth-desc {
      margin: 0 0 18px;
      font-size: 14.5px;
      line-height: 1.6;
      color: var(--muted);
    }
    #login, #logout {
      width: 100%;
      display: block;
      margin: 0 0 10px;
      padding: 13px 18px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      border: none;
    }
    #login { background: var(--accent); color: #ffffff; }
    #login:hover { background: var(--accent-hover); }
    #logout { background: #dc2626; color: #ffffff; }
    #logout:hover { background: #b91c1c; }
    #status {
      margin: 10px 0 0;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--soft);
      border: 1px solid var(--border);
      font-size: 14px;
      font-weight: 700;
    }
    .auth-nav {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 13.5px;
      font-weight: 700;
    }
    .auth-nav a { color: var(--accent); text-decoration: none; }
    .auth-nav a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="auth-card">
    <div class="auth-badge">🔐 Hán Ngữ Studio · Supabase Auth</div>
    <h1>Tài khoản Học tập &amp; Đăng nhập Google</h1>
    <p class="auth-desc">Đăng nhập an toàn bằng tài khoản Google để đồng bộ tiến độ HSK, từ vựng đã thuộc, thẻ ôn SRS và ghi chú cá nhân trên mọi thiết bị.</p>
  <button id="login">Đăng nhập bằng Google</button>
  <button id="logout" hidden>Đăng xuất</button>
    <p id="status" role="status">Đang kiểm tra đăng nhập...</p>
    <nav class="auth-nav" aria-label="Điều hướng tài khoản">
      <a href="/">← Về trang chủ Hán Ngữ Studio</a>
      <a href="/tai-khoan">Trang Tài khoản đầy đủ →</a>
    </nav>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.min.js"></script>
  <script>
    const client = window.supabase.createClient(
      "https://skxgzzdunqloxxombtuc.supabase.co",
      "sb_publishable_tyYxDk87Wa70dYxea2ljug_DCZEx-18"
    );

    const login = document.getElementById("login");
    const logout = document.getElementById("logout");
    const status = document.getElementById("status");

    login.onclick = async () => {
      const { error } = await client.auth.signInWithOAuth({
        provider: "google",
        options: {
          redirectTo:
            "https://hoctiengtrungquoc.vercel.app/tai-khoan"
        }
      });

      if (error) status.textContent = error.message;
    };

    logout.onclick = async () => {
      const { error } = await client.auth.signOut();
      if (error) status.textContent = error.message;
    };

    function updateUI(session) {
      const user = session?.user;
      status.textContent = user
        ? "Đã đăng nhập: " + user.email
        : "Chưa đăng nhập";
      login.hidden = !!user;
      logout.hidden = !user;
      if (user && session?.access_token) {
        try {
          const meta = user.user_metadata || {};
          const displayName = meta.full_name || meta.name || user.email.split("@")[0];
          const avatar = meta.avatar_url || meta.picture || "";
          const userObj = {
            id: user.id,
            _id: user.id,
            email: user.email,
            username: user.email.split("@")[0],
            name: displayName,
            displayName: displayName,
            avatar: avatar,
            role: "user",
            isGuest: false,
            streak: 5
          };
          localStorage.setItem("xiehanzi_access_token", session.access_token);
          localStorage.setItem("sb_access_token", session.access_token);
          localStorage.setItem("httq_user", JSON.stringify(userObj));
          localStorage.setItem("httq_user_id", user.id);
          localStorage.setItem("httq_real_auth", "1");
        } catch (_e) {}
      }
    }

    client.auth.onAuthStateChange((_event, session) => {
      updateUI(session);
    });

    client.auth.getSession().then(({ data, error }) => {
      if (error) {
        status.textContent = error.message;
        return;
      }
      updateUI(data.session);
    });
  </script>
</body>
</html>
