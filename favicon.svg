<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="55%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background Squircle Badge -->
  <rect x="20" y="20" width="460" height="460" rx="112" fill="url(#bgGrad)"/>
  <rect x="34" y="34" width="432" height="432" rx="98" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-opacity="0.88"/>
  <circle cx="250" cy="235" r="185" fill="url(#glow)"/>
  <!-- Traditional Cloud Motif -->
  <path d="M90 385 Q125 360 160 380 Q195 355 230 378 Q275 352 320 380 Q360 362 410 385" fill="none" stroke="#99f6e4" stroke-width="6" stroke-linecap="round" opacity="0.28"/>
  <!-- Scholar Panda Ears -->
  <circle cx="152" cy="175" r="46" fill="#0f172a"/>
  <circle cx="152" cy="175" r="22" fill="#1e293b"/>
  <circle cx="348" cy="175" r="46" fill="#0f172a"/>
  <circle cx="348" cy="175" r="22" fill="#1e293b"/>
  <!-- Panda Head -->
  <ellipse cx="250" cy="272" rx="126" ry="110" fill="#f8fafc"/>
  <ellipse cx="250" cy="272" rx="126" ry="110" fill="none" stroke="#e2e8f0" stroke-width="5"/>
  <!-- Jade Scholar Hat -->
  <path d="M185 162 L315 162 L305 112 Q250 96 195 112 Z" fill="#115e59" stroke="#fcd34d" stroke-width="6"/>
  <rect x="132" y="152" width="236" height="16" rx="8" fill="#1e1b4b" stroke="#fcd34d" stroke-width="5"/>
  <rect x="236" y="114" width="28" height="28" rx="6" fill="url(#goldGrad)"/>
  <!-- Eye Patches -->
  <ellipse cx="198" cy="260" rx="34" ry="40" transform="rotate(-18 198 260)" fill="#0f172a"/>
  <ellipse cx="302" cy="260" rx="34" ry="40" transform="rotate(18 302 260)" fill="#0f172a"/>
  <!-- Sparkling Eyes -->
  <circle cx="202" cy="256" r="13" fill="#ffffff"/>
  <circle cx="204" cy="256" r="7" fill="#0f766e"/>
  <circle cx="207" cy="252" r="4" fill="#ffffff"/>
  <circle cx="298" cy="256" r="13" fill="#ffffff"/>
  <circle cx="296" cy="256" r="7" fill="#0f766e"/>
  <circle cx="299" cy="252" r="4" fill="#ffffff"/>
  <!-- Blush Cheeks -->
  <ellipse cx="164" cy="304" rx="20" ry="11" fill="#f43f5e" opacity="0.32"/>
  <ellipse cx="336" cy="304" rx="20" ry="11" fill="#f43f5e" opacity="0.32"/>
  <!-- Nose & Gentle Smile -->
  <path d="M234 294 Q250 284 266 294 Q250 314 234 294 Z" fill="#0f172a"/>
  <path d="M250 307 L250 322 M230 320 Q240 335 250 322 Q260 335 270 320" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
  <!-- Golden Brush & Scroll Accent -->
  <g transform="translate(344, 344) rotate(-32)">
    <rect x="-10" y="-65" width="20" height="90" rx="8" fill="url(#goldGrad)" stroke="#78350f" stroke-width="4"/>
    <path d="M-12 25 L12 25 L6 52 Q0 62 -6 52 Z" fill="#1e293b"/>
    <path d="M-5 44 L5 44 L0 58 Z" fill="#14b8a6"/>
  </g>
  <!-- Jade Seal Stamp '文' -->
  <g transform="translate(88, 336) rotate(-8)">
    <rect x="0" y="0" width="66" height="66" rx="14" fill="#0f766e" stroke="#99f6e4" stroke-width="5"/>
    <text x="33" y="47" font-family="serif" font-size="40" font-weight="bold" text-anchor="middle" fill="#ffffff">文</text>
  </g>
</svg>
